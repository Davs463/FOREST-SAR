<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500" font-family="'Inter Tight','Inter','Segoe UI',Arial,sans-serif">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#52796f"/></marker></defs>
<rect width="1000" height="500" fill="#ffffff"/><text x="20" y="34" font-size="15" font-weight="700" fill="#52796f">EN EL COMPUTADOR DEL EQUIPO (con red y credenciales)  →  ARCHIVOS ESTÁTICOS</text><rect x="20" y="60" width="280" height="170" rx="14" fill="#f5f5f0" stroke="#102820" stroke-width="1.6"/><text x="160" y="100" font-size="21" font-weight="700" fill="#102820" text-anchor="middle">Fuentes NASA</text><text x="160" y="134" font-size="15" font-weight="400" fill="#52796f" text-anchor="middle">Earthdata: CMR (catálogo),</text><text x="160" y="153.5" font-size="15" font-weight="400" fill="#52796f" text-anchor="middle">Harmony (recorte), ASF DAAC</text><rect x="360" y="60" width="280" height="170" rx="14" fill="#a3d977" stroke="#102820" stroke-width="1.6"/><text x="500" y="100" font-size="21" font-weight="700" fill="#102820" text-anchor="middle">Motor Python</text><text x="500" y="134" font-size="15" font-weight="400" fill="#52796f" text-anchor="middle">scientific-engine/: earthaccess,</text><text x="500" y="153.5" font-size="15" font-weight="400" fill="#52796f" text-anchor="middle">rasterio, numpy, shapely</text><rect x="700" y="60" width="280" height="170" rx="14" fill="#a3d977" stroke="#102820" stroke-width="1.6"/><text x="840" y="100" font-size="21" font-weight="700" fill="#102820" text-anchor="middle">Archivos científicos</text><text x="840" y="126.25" font-size="21" font-weight="700" fill="#102820" text-anchor="middle">versionados</text><text x="840" y="160" font-size="15" font-weight="400" fill="#52796f" text-anchor="middle">public/data/snapshots:</text><text x="840" y="179.5" font-size="15" font-weight="400" fill="#52796f" text-anchor="middle">JSON, GeoJSON, PNG</text><text x="20" y="272" font-size="15" font-weight="700" fill="#52796f">EN EL NAVEGADOR DEL USUARIO (sin cuenta, sin credenciales, sin backend)</text><rect x="20" y="290" width="280" height="170" rx="14" fill="#f5f5f0" stroke="#102820" stroke-width="1.6"/><text x="160" y="330" font-size="21" font-weight="700" fill="#102820" text-anchor="middle">Frontend React</text><text x="160" y="364" font-size="15" font-weight="400" fill="#52796f" text-anchor="middle">React 19 + TypeScript + Vite;</text><text x="160" y="383.5" font-size="15" font-weight="400" fill="#52796f" text-anchor="middle">Leaflet para los mapas</text><rect x="360" y="290" width="280" height="170" rx="14" fill="#102820" stroke="#102820" stroke-width="1.6"/><text x="500" y="330" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Mapas y Analytics</text><text x="500" y="364" font-size="15" font-weight="400" fill="#cfe3d4" text-anchor="middle">Observatorio, Evolución,</text><text x="500" y="383.5" font-size="15" font-weight="400" fill="#cfe3d4" text-anchor="middle">Observaciones, Datos técnicos</text><rect x="700" y="290" width="280" height="170" rx="14" fill="#102820" stroke="#102820" stroke-width="1.6"/><text x="840" y="330" font-size="21" font-weight="700" fill="#ffffff" text-anchor="middle">Usuario</text><text x="840" y="364" font-size="15" font-weight="400" fill="#cfe3d4" text-anchor="middle">Persona de la comunidad,</text><text x="840" y="383.5" font-size="15" font-weight="400" fill="#cfe3d4" text-anchor="middle">docente, técnico o evaluador</text><path d="M300 145 H356" fill="none" stroke="#52796f" stroke-width="2.4" marker-end="url(#ar)"/><path d="M640 145 H696" fill="none" stroke="#52796f" stroke-width="2.4" marker-end="url(#ar)"/><path d="M840 230 V258 H160 V250" fill="none" stroke="#52796f" stroke-width="2.4" marker-end="url(#ar)"/><path d="M300 375 H356" fill="none" stroke="#52796f" stroke-width="2.4" marker-end="url(#ar)"/><path d="M640 375 H696" fill="none" stroke="#52796f" stroke-width="2.4" marker-end="url(#ar)"/></svg>